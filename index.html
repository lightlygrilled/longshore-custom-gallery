<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Gallery Slider</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <!-- Main Slider -->
        <div class="gallery-main" data-thumbs-desktop="5" data-thumbs-tablet="3" data-thumbs-mobile="2">
            <div class="gallery-slide">
                <img src="https://cdn.prod.website-files.com/68d273a7260d1d443009a103/68d621b83de35dba15b42754_imgi_100_44b08b_0ccb6b6d117a46609c3642d4324ea0dd~mv2.webp" alt="Slide 1">
                <div class="gallery-slide-content">
                    <h3>Beautiful Landscape 1</h3>
                    <p>Amazing view of mountains and lakes</p>
                </div>
            </div>
            <div class="gallery-slide">
                <img src="https://cdn.prod.website-files.com/68d273a7260d1d443009a103/68d621b9215d6ba76fd24907_imgi_104_44b08b_6d03631e561a47c8813d2ee232388dd9~mv2.webp" alt="Slide 2">
                <div class="gallery-slide-content">
                    <h3>Beautiful Landscape 2</h3>
                    <p>Stunning sunset over the ocean</p>
                </div>
            </div>
            <div class="gallery-slide">
                <img src="https://cdn.prod.website-files.com/68d273a7260d1d443009a103/68d621b8379ff75b52d9b576_imgi_106_44b08b_e60960d7bd7441b5b420f30a4abd64d5~mv2.webp" alt="Slide 3">
                <div class="gallery-slide-content">
                    <h3>Beautiful Landscape 3</h3>
                    <p>Forest path leading to adventure</p>
                </div>
            </div>
            <div class="gallery-slide">
                <img src="https://cdn.prod.website-files.com/68d273a7260d1d443009a103/68d621b83de35dba15b42754_imgi_100_44b08b_0ccb6b6d117a46609c3642d4324ea0dd~mv2.webp" alt="Slide 4">
                <div class="gallery-slide-content">
                    <h3>Beautiful Landscape 4</h3>
                    <p>Urban cityscape at night</p>
                </div>
            </div>
            <div class="gallery-slide">
                <img src="https://cdn.prod.website-files.com/68d273a7260d1d443009a103/68d621b8e99c2cf4c594a0b4_imgi_99_44b08b_a2526bbc355143b085380479a6cd653c~mv2.webp" alt="Slide 5">
                <div class="gallery-slide-content">
                    <h3>Beautiful Landscape 5</h3>
                    <p>Desert dunes under starry sky</p>
                </div>
            </div>
        </div>

        <!-- Thumbnail Slider (Auto-generated) -->
        <div class="gallery-thumbnails">
            <!-- Thumbnails will be auto-generated here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
